<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>operator in js</title>
</head>
<body>
    <script>
        let a = 12;
        let b = 30;
        let c = a+b;
        alert("Sum is = "+c);
        c = a-b;
        alert("subtraction = "+c);

        c = a*b;
        alert("Mul = "+c);

        c = a/b;
        alert("Div = "+c);
    </script>
</body>
</html>
