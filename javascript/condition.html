<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condition</title>
</head>
<body>
    <script>
        let a = prompt("Enter a number:");

        let org = a;
        let arm = 0;
        let count = 0;
        while (a > 0) {
            a = Math.floor(a / 10);
            count++;
        }
        a = org;
        while(a){
            arm += a%10 ** count;
            a = Math.floor(a / 10);
        }

        if(arm == org) {
            alert(org + " is an Armstrong number.");
        } else {
            alert(org + " is not an Armstrong number.");
        }
    </script>
</body>
</html>
