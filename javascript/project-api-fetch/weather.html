<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin: 15px 0;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #weather {
            margin-top: 25px;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Weather App</h1>

        <select id="place">
            <option value="">Select a place</option>

            <option value="28.6139,77.2090">
                Delhi
            </option>

            <option value="19.0760,72.8777">
                Mumbai
            </option>

            <option value="12.9716,77.5946">
                Bangalore
            </option>

            <option value="13.0827,80.2707">
                Chennai
            </option>

            <option value="22.5726,88.3639">
                Kolkata
            </option>

            <option value="28.6692,77.4538">
                Ghaziabad
            </option>
        </select>

        <button id="getWeather">
            Get Weather
        </button>

        <div id="weather"></div>

    </div>


    <script>

        const place = document.querySelector("#place");
        const button = document.querySelector("#getWeather");
        const weather = document.querySelector("#weather");


        async function getWeather() {

            if (place.value === "") {
                weather.innerHTML = "Please select a place.";
                return;
            }

            const [latitude, longitude] = place.value.split(",");

            const URL =
                `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`;

            try {

                weather.innerHTML = "Loading...";

                const res = await fetch(URL);

                const data = await res.json();

                console.log(data);

                weather.innerHTML = `
                    <h2>${place.options[place.selectedIndex].text}</h2>

                    <p>
                        🌡️ Temperature:
                        ${data.current.temperature_2m}
                        ${data.current_units.temperature_2m}
                    </p>

                    <p>
                        💧 Humidity:
                        ${data.current.relative_humidity_2m}
                        ${data.current_units.relative_humidity_2m}
                    </p>

                    <p>
                        💨 Wind Speed:
                        ${data.current.wind_speed_10m}
                        ${data.current_units.wind_speed_10m}
                    </p>
                `;

            }
            catch (error) {

                console.log("ERROR:", error);

                weather.innerHTML =
                    "Unable to fetch weather data.";

            }
        }


        button.addEventListener("click", getWeather);

    </script>

</body>
</html>
